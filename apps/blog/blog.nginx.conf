server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /_blog_access {
    internal;
    # Existing backend port on the Docker bridge gateway, without public DNS.
    proxy_pass http://172.17.0.1:3000/api/auth/blog-access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
  }

  location = /_blog_denied {
    internal;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    return 200 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>无法访问文章</title><body><p>当前无法访问文章，请返回主站登录或检查访问权限。</p><a href="/blog/" target="_top">返回市场那些事</a><script>if(window.parent!==window)window.parent.postMessage({type:"stock-blog-denied"},location.origin)</script></body></html>';
  }

  location / {
    auth_request /_blog_access;
    error_page 401 403 =403 /_blog_denied;
    # Support both stripping reverse proxies and direct prefixed requests.
    rewrite ^/blog-frame/(.*)$ /$1 break;
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "private, no-store" always;
  }
}
