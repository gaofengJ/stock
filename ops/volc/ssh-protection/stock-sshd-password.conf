# Count only actual password failures. Key auth, network resets, and closed CI sessions
# must never count as abusive attempts. Anchor the host at sshd's final address field.
[INCLUDES]
before = common.conf

[Definition]
_daemon = sshd
failregex = ^%(__prefix_line)sFailed password for (?:invalid user )?.+ from <HOST> port \d+ ssh2(?: \[preauth\])?\s*$
ignoreregex =
journalmatch = _SYSTEMD_UNIT=ssh.service + _COMM=sshd
