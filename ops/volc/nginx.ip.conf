# Install only after the IP certificate has been issued and nginx -t succeeds.
server {
  listen 80 default_server;
  server_name 14.103.103.4;
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    try_files $uri =404;
  }
  location / { return 308 https://14.103.103.4$request_uri; }
}

server {
  listen 443 ssl http2 default_server;
  server_name 14.103.103.4;
  ssl_certificate /etc/letsencrypt/live/14.103.103.4/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/14.103.103.4/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:stock_tls:10m;
  server_tokens off;
  client_max_body_size 20m;
  # JSON and JS dominate transfer time on the ECS public bandwidth limit.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;
  access_log /var/log/nginx/stock-access.log stock_json;
  error_log /var/log/nginx/stock-error.log warn;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;

  location ~ /\.(?!well-known(?:/|$)) { return 404; }
  location /api/ {
    if (-f /srv/stock/state/maintenance) { return 503; }
    proxy_pass http://127.0.0.1:3000;
  }
  location = /blog-frame { return 308 /blog-frame/; }
  location /blog-frame/ {
    if (-f /srv/stock/state/maintenance) { return 503; }
    proxy_pass http://127.0.0.1:8082/;
  }
  location / {
    if (-f /srv/stock/state/maintenance) { return 503; }
    proxy_pass http://127.0.0.1:8081;
  }
}
