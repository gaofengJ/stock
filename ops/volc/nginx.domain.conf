# Installed separately from the existing IP virtual host. Issue the SAN certificate first.
server {
  listen 80;
  server_name mufengtongxue.com www.mufengtongxue.com stock.mufengtongxue.com blog.mufengtongxue.com;
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    try_files $uri =404;
  }
  location / { return 308 https://$host$request_uri; }
}
server {
  listen 443 ssl http2;
  server_name mufengtongxue.com www.mufengtongxue.com;
  ssl_certificate /etc/letsencrypt/live/mufengtongxue.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mufengtongxue.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  return 308 https://stock.mufengtongxue.com$request_uri;
}
server {
  listen 443 ssl http2;
  server_name stock.mufengtongxue.com;
  ssl_certificate /etc/letsencrypt/live/mufengtongxue.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mufengtongxue.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:stock_tls:10m;
  server_tokens off;
  client_max_body_size 20m;
  # JSON and JS dominate transfer time on the ECS public bandwidth limit.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;
  access_log /var/log/nginx/stock-access.log stock_json;
  error_log /var/log/nginx/stock-error.log warn;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;

  location ~ /\.(?!well-known(?:/|$)) { return 404; }
  # Personal Codex console: isolated service; existing website upstreams unchanged.
  location = /personal-ai { return 302 /admin/ai/; }
  location = /personal-ai/ { return 302 /admin/ai/; }
  location ^~ /personal-ai/ {
    client_max_body_size 20k;
    proxy_pass http://127.0.0.1:18787;
    proxy_read_timeout 40s;
    proxy_buffering off;
    access_log off;
  }
  location /api/ {
    if (-f /srv/stock/state/maintenance) { return 503; }
    proxy_pass http://127.0.0.1:3000;
  }
  location = /blog-frame { return 308 /blog-frame/; }
  location /blog-frame/ {
    if (-f /srv/stock/state/maintenance) { return 503; }
    proxy_pass http://127.0.0.1:8082/;
  }
  location / {
    if (-f /srv/stock/state/maintenance) { return 503; }
    proxy_pass http://127.0.0.1:8081;
  }
}

server {
  listen 443 ssl http2;
  server_name blog.mufengtongxue.com;
  ssl_certificate /etc/letsencrypt/live/mufengtongxue.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mufengtongxue.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript text/css text/plain image/svg+xml;
  location ~ /\.(?!well-known(?:/|$)) { return 404; }
  location / {
    proxy_pass http://127.0.0.1:8080;
    # Keep the preserved static blog intact; add filing outside its Vue mount.
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '</body>' '<footer style="padding:20px;text-align:center;font-size:12px"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">沪ICP备2026056391号-1</a></footer></body>';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
}
