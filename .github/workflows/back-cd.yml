name: Stock CI and release
on:
  pull_request:
    branches:
      - master
    paths:
      - apps/back/**
      - apps/front/**
      - .github/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .dockerignore
  push:
    branches:
      - master
    paths:
      - apps/back/**
      - apps/front/**
      - .github/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .dockerignore
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish validation images without deploying production
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish_images:
        description: Publish validation images without deploying production
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: stock-back-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            apps/back
      - run: node .github/scripts/check-env-secrets.cjs apps/back/.env.production
      - run: node --test .github/scripts/test-release-tools.cjs
      - run: node --test .github/scripts/test-publish-verified-image.cjs
      - run: node --test .github/scripts/test-indexnow.cjs
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*bloomberg*.py'
      - run: python3 -m unittest discover -s .github/scripts -p 'test_sina_relay.py'
      - uses: actions/github-script@v7
        id: scope
        with:
          script: |-
            const { releaseScope } = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/release-scope.cjs');
            let files = [], complete = false;
            if (context.eventName === 'pull_request') {
              const result = await github.paginate(github.rest.pulls.listFiles, {...context.repo, pull_number: context.issue.number, per_page: 100});
              files = result.flatMap(f => [f.filename, f.previous_filename].filter(Boolean));
              complete = result.length < 3000;
            } else if (context.eventName === 'push' && !/^0+$/.test(context.payload.before)) {
              const {data} = await github.rest.repos.compareCommits({...context.repo, base: context.payload.before, head: context.sha});
              files = (data.files || []).flatMap(f => [f.filename, f.previous_filename].filter(Boolean));
              complete = (data.files || []).length < 300;
            }
            for (const [key, value] of Object.entries(releaseScope(files, complete, context.eventName))) core.setOutput(key, String(value));
  verify:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7.33
        env:
          MYSQL_ROOT_PASSWORD: ci-local-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-local-only" --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |-
            apps/back
            .github
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/back/package.json
      - run: pnpm install --filter back --frozen-lockfile
      - run: pnpm -C apps/back run lint
      - run: pnpm -C apps/back run build
      - name: Check every migration has a reviewed space policy
        run: node apps/back/scripts/check-migration-policy.cjs
      - name: Test release maintenance and shell syntax
        run: |
          python3 -m unittest discover -s apps/back/ops/release -p 'test_*.py'
          bash -n apps/back/ops/release/deploy.sh apps/back/ops/release/deploy-front.sh apps/back/ops/release/backup.sh apps/back/ops/release/daily-backup.sh
      - name: Verify release scripts on production Python 3.5
        run: docker run --rm --mount "type=bind,src=$PWD/apps/back/ops/release,dst=/work,readonly" --workdir /work python:3.5-slim python -m unittest discover -p 'test_*.py'
      - run: pnpm -C apps/back run test --runInBand
        env:
          # Set at process startup, matching the runtime image. Jest's env proxy
          # cannot change the host timezone used by daily log filenames.
          TZ: Asia/Shanghai
          SYNC_TEST_MYSQL_PORT: 3306
          SYNC_TEST_MYSQL_PASSWORD: ci-local-only
      - run: node --test apps/back/ops/backfill-intraday-counts.test.cjs
      - name: Account integration and legacy migration
        working-directory: apps/back
        env:
          AUTH_TEST_PORT: 3306
          AUTH_TEST_PASSWORD: ci-local-only
        run: |
          AUTH_TEST_DATABASE=stock_auth_test_ci node test/accounts.integration.cjs
          AUTH_TEST_DATABASE=stock_auth_test_legacy_ci node test/migration-legacy.cjs
  image:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |-
            apps/back
            .github
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Verify production image and native Argon2 runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/back/dockerfile
          platforms: linux/amd64
          load: true
          tags: stock-back-verify
          cache-from: |-
            type=gha,version=2,scope=stock-back-runtime-v2
            type=gha,version=2,scope=stock-back-verify
          cache-to: type=gha,version=2,scope=stock-back-runtime-v2,mode=max
          provenance: false
      - name: Verify native dependencies and runtime configuration
        run: |-
          docker image inspect stock-back-verify --format 'Runtime image bytes: {{.Size}}'
          docker run --rm stock-back-verify node scripts/check-argon2.cjs
          docker run --rm stock-back-verify node scripts/check-image.cjs
          printf 'DB_HOST=runtime-config.invalid\nDB_DATABASE=stock_ci\nDB_PASSWORD="quoted # value"\n' > "$RUNNER_TEMP/runtime.env"
          docker run --rm --mount "type=bind,src=$RUNNER_TEMP/runtime.env,dst=/run/stock/runtime.env,readonly" -e APP_ENV_FILE=/run/stock/runtime.env stock-back-verify node scripts/check-image.cjs
      - name: Verify private bindings preserve host and article proxy access
        run: |
          gateway=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          external=$(hostname -I | awk '{print $1}')
          trap 'docker stop stock-back-private-port-verify >/dev/null 2>&1 || true' EXIT
          docker run --rm -d --name stock-back-private-port-verify -p 127.0.0.1:33009:3000 -p "$gateway:33009:3000" stock-back-verify node -e 'require("http").createServer((req,res)=>{res.writeHead(204);res.end()}).listen(3000,"0.0.0.0")'
          for attempt in $(seq 1 15); do
            if curl --noproxy '*' --fail --silent --max-time 2 "http://127.0.0.1:33009/"; then break; fi
            sleep 1
          done
          curl --noproxy '*' --fail --silent --max-time 5 "http://127.0.0.1:33009/"
          docker run --rm -e AUDIT_PRIVATE_GATEWAY="$gateway" stock-back-verify node -e '(async()=>{const r=await fetch("http://"+process.env.AUDIT_PRIVATE_GATEWAY+":33009/",{signal:AbortSignal.timeout(5000)});if(r.status!==204)process.exit(1)})().catch(()=>process.exit(1))'
          if curl --noproxy '*' --fail --silent --max-time 3 "http://$external:33009/"; then echo 'Backend binding unexpectedly accepts public interface traffic'; exit 1; fi
      - name: Save the verified runtime image for publication
        run: docker save stock-back-verify | gzip -1 > "$RUNNER_TEMP/stock-back-image.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: stock-back-image-${{ github.sha }}
          path: ${{ runner.temp }}/stock-back-image.tar.gz
          if-no-files-found: error
          retention-days: 1
  front:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/front-cd.yml
  publish-back:
    needs:
      - changes
      - verify
      - image
      - front
    if: needs.changes.outputs.backend == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || inputs.publish_images == true)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Limit image upload concurrency on the publication runner
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          config = json.loads(path.read_text()) if path.exists() else {}
          config['max-concurrent-uploads'] = 1
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config))
          PY
          sudo systemctl restart docker
          docker info > /dev/null
      - uses: actions/download-artifact@v4
        with:
          name: stock-back-image-${{ github.sha }}
          path: ${{ runner.temp }}/stock-back-image
      - name: Publish the exact verified runtime image
        env:
          IMAGE: registry.cn-hangzhou.aliyuncs.com/mufengtongxue/stock-back:${{ github.sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          gzip -dc "$RUNNER_TEMP/stock-back-image/stock-back-image.tar.gz" | docker load
          docker tag stock-back-verify "$IMAGE"
          bash .github/scripts/publish-verified-image.sh
      - name: Report compressed runtime image size
        env:
          IMAGE: registry.cn-hangzhou.aliyuncs.com/mufengtongxue/stock-back:${{ github.sha }}
        run: docker buildx imagetools inspect "$IMAGE" --raw | python3 -c 'import json,sys; m=json.load(sys.stdin); print("Compressed runtime image bytes:", sum(layer["size"] for layer in m["layers"]))'
      - name: Remove registry credentials
        if: always()
        run: docker logout registry.cn-hangzhou.aliyuncs.com > /dev/null 2>&1
  publish-front:
    needs:
      - changes
      - front
    if: needs.changes.outputs.frontend == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || inputs.publish_images == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/front
            .github
      - uses: actions/download-artifact@v4
        with:
          name: stock-front-${{ github.sha }}
          path: apps/front/out
      - name: Prepare search engine ownership verification
        env:
          SITE_INDEXNOW_KEY: ${{ secrets.SITE_INDEXNOW_KEY }}
        run: node .github/scripts/write-indexnow-key.cjs apps/front/out
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Login to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: apps/front
          platforms: linux/amd64
          push: true
          tags: registry.cn-hangzhou.aliyuncs.com/mufengtongxue/stock-front:${{ github.sha }}
          cache-from: type=gha,version=2,scope=stock-front
          cache-to: type=gha,version=2,scope=stock-front,mode=max
          provenance: false
  deploy-back:
    needs: publish-back
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |-
            apps/back
            .github
      - name: Prepare production environment without logging credentials
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          TUSHARE_CONF_TOKEN: ${{ secrets.TUSHARE_CONF_TOKEN }}
          ADMIN_PLAYBOOK_GZIP_BASE64: ${{ secrets.ADMIN_PLAYBOOK_GZIP_BASE64 }}
        run: node .github/scripts/render-runtime-env.cjs apps/back/.env.production apps/back/ops/release/runtime.env
      - name: Upload versioned release scripts
        # Composite action runs as the runner user and can read mode-600 configuration.
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: apps/back/ops/release,apps/back/ops/test-db
          target: /opt/stock-release/packages/${{ github.sha }}
          strip_components: 3
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,RELEASE_SHA
          command_timeout: 120m
          script: bash /opt/stock-release/packages/${{ github.sha }}/release/deploy.sh
  deploy-front:
    needs:
      - changes
      - publish-front
      - deploy-back
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.publish-front.result == 'success' && (needs.changes.outputs.backend != 'true' || needs.deploy-back.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/back/ops/release
            .github
      - name: Upload versioned frontend release scripts
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: apps/back/ops/release
          target: /opt/stock-release/packages/${{ github.sha }}
          strip_components: 3
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,RELEASE_SHA
          script: bash /opt/stock-release/packages/${{ github.sha }}/release/deploy-front.sh
      - name: Notify participating search engines of public pages
        continue-on-error: true
        env:
          SITE_INDEXNOW_KEY: ${{ secrets.SITE_INDEXNOW_KEY }}
        run: node .github/scripts/submit-indexnow.cjs
