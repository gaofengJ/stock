# actions 名称
name: Docker Stock Blog

# 执行时机
on:
  workflow_dispatch:
    inputs:
      reuse_media:
        description: 'Style-only release: verify and reuse existing media on the server'
        type: boolean
        default: false
  pull_request:
    branches: [master]
    paths:
      - 'apps/blog/**'
      - '.github/scripts/*blog*'
      - '.github/workflows/blog-cd.yml'
      - 'ops/blog-deploy/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.dockerignore'
  # 监听 push 操作
  # 合并后部署；PR 仅构建与验证。
  push:
    branches:
      - master
    paths:
      - 'apps/blog/**'
      - '.github/scripts/*blog*'
      - '.github/workflows/blog-cd.yml'
      - 'ops/blog-deploy/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.dockerignore'

permissions:
  contents: read
  actions: read

# 任务
concurrency:
  group: stock-blog-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码 (升级到 v4)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select incremental release
        id: media
        env:
          FORCE_REUSE: ${{ inputs.reuse_media }}
        run: |
          reuse=false
          # Pushes build the full image: the previous Git commit need not be deployed.
          # Explicit reuse still validates every media hash against the running image.
          if [ "$FORCE_REUSE" = true ]; then
            reuse=true
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"

      # 2. 安装 pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # 3. 设置 Node.js 环境并开启缓存 (关键优化)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 4. 安装依赖 (使用 frozen-lockfile 确保依赖版本一致性)
      - name: Install Dependencies
        run: pnpm install --filter blog --frozen-lockfile

      - name: Test article metadata and content access
        run: |
          pnpm -C apps/blog run test
          node --test .github/scripts/test-blog-overlay.cjs
          python3 -B -m unittest discover -s ops/blog-deploy -p 'test_*.py'
          for script in ops/blog-deploy/deploy.sh .github/scripts/clean-blog-overlay.sh; do sh -n "$script"; done
          bash -n .github/scripts/deploy-blog-style.sh
          node .github/scripts/test-blog-server.cjs

      # 5. 打包项目 (生成静态文件)
      - name: Build Project
        run: pnpm run build:blog

      - name: Wait for matching backend release
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 90; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'back-cd.yml', head_sha: context.sha, event: 'push', per_page: 10 });
              const run = data.workflow_runs[0];
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error('Matching backend/frontend release did not succeed');
                return;
              }
              // Blog-only updates need no backend deployment; the server
              // preflight still verifies the permission endpoint exists.
              if (!run && attempt === 3) return;
              await new Promise(resolve => setTimeout(resolve, 20000));
            }
            throw new Error('Timed out waiting for backend release');

      # 6. 登录阿里云镜像容器服务 (使用官方 Action)
      - name: Login to Aliyun Registry
        if: github.event_name != 'pull_request' && steps.media.outputs.reuse != 'true'
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7. 构建并推送镜像 (使用官方 Action，支持缓存)
      - name: Build and Push Docker Image
        if: github.event_name != 'pull_request' && steps.media.outputs.reuse != 'true'
        uses: docker/build-push-action@v5
        with:
          context: apps/blog
          push: true
          # 保持使用 stock-blog 镜像名，与之前的修改保持一致
          tags: registry.cn-hangzhou.aliyuncs.com/mufengtongxue/stock-blog:${{ github.sha }}
          build-args: RELEASE_SHA=${{ github.sha }}

      - name: Upload versioned article deployer
        if: github.event_name != 'pull_request'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ops/blog-deploy/deploy.sh
          target: /opt/stock-blog-style/${{ github.sha }}

      # 8. 远程部署 (使用环境变量传递 Secrets，更安全)
      - name: Deploy to Server
        if: github.event_name != 'pull_request' && steps.media.outputs.reuse != 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          # 将敏感信息注入环境变量
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,RELEASE_SHA
          # 脚本中不再显式传递参数，而是需要在脚本内读取环境变量
          script: |
            status=$(curl --max-time 10 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/auth/blog-access)
            [ "$status" = 401 ] || [ "$status" = 403 ] || exit 1
            sh /opt/stock-blog-style/${{ github.sha }}/ops/blog-deploy/deploy.sh

      - name: Package verified style overlay
        if: github.event_name != 'pull_request' && steps.media.outputs.reuse == 'true'
        run: |
          node .github/scripts/package-blog-style.cjs
          tar -czf blog-style.tgz -C .blog-style-release .
          ls -lh blog-style.tgz

      - name: Upload style overlay
        if: github.event_name != 'pull_request' && steps.media.outputs.reuse == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: 'blog-style.tgz,.github/scripts/deploy-blog-style.sh'
          target: /opt/stock-blog-style/${{ github.sha }}
          command_timeout: 20m

      - name: Verify media and deploy article styles
        if: github.event_name != 'pull_request' && steps.media.outputs.reuse == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_SHA: ${{ github.sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: RELEASE_SHA,DOCKER_USERNAME,DOCKER_PASSWORD
          command_timeout: 30m
          script: bash /opt/stock-blog-style/${{ github.sha }}/.github/scripts/deploy-blog-style.sh
