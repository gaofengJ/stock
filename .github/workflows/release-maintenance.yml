name: Read-only registry diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/codex/diagnose-registry-push-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Compare image metadata without downloading layers or pushing images
        env:
          REGISTRY_USER: ${{ secrets.DOCKER_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error,base64,re,time
          ACCEPT=','.join(['application/vnd.oci.image.index.v1+json','application/vnd.docker.distribution.manifest.list.v2+json','application/vnd.oci.image.manifest.v1+json','application/vnd.docker.distribution.manifest.v2+json'])
          
          def request(url,headers=None,method='GET'):
              req=urllib.request.Request(url,headers=headers or {},method=method)
              with urllib.request.urlopen(req,timeout=40) as r:
                  data=r.read(2_000_000) if method=='GET' else b''
                  return json.loads(data) if data else {},dict(r.headers)
          
          def client(host,repo,private=False):
              try: request('https://'+host+'/v2/')
              except urllib.error.HTTPError as e:
                  if e.code!=401: raise
                  params=dict(re.findall(r'(\w+)="([^"]+)"',e.headers['WWW-Authenticate']))
              realm=params['realm']
              assert urllib.parse.urlparse(realm).hostname in ('auth.docker.io','dockerauth.cn-hangzhou.aliyuncs.com')
              headers={}
              if private:
                  raw=(os.environ['REGISTRY_USER']+':'+os.environ['REGISTRY_PASSWORD']).encode()
                  headers['Authorization']='Basic '+base64.b64encode(raw).decode()
              auth,_=request(realm+'?'+urllib.parse.urlencode({'service':params['service'],'scope':'repository:'+repo+':pull'}),headers)
              token=auth.get('token') or auth['access_token']
              return 'https://'+host+'/v2/'+repo,{'Authorization':'Bearer '+token,'Accept':ACCEPT}
          
          def inspect(label,host,repo,ref,private=False):
              started=time.monotonic()
              base,headers=client(host,repo,private)
              manifest,_=request(base+'/manifests/'+ref,headers)
              if 'manifests' in manifest:
                  chosen=next(x for x in manifest['manifests'] if x.get('platform',{}).get('os')=='linux' and x['platform'].get('architecture')=='amd64')
                  manifest,_=request(base+'/manifests/'+chosen['digest'],headers)
              config,_=request(base+'/blobs/'+manifest['config']['digest'],headers)
              history=[h for h in config.get('history',[]) if not h.get('empty_layer')]
              rows=[]
              for i,(layer,diff) in enumerate(zip(manifest['layers'],config['rootfs']['diff_ids'])):
                  cmd=history[i].get('created_by','') if i<len(history) else ''
                  kind=('production dependencies' if 'pnpm install' in cmd and '--prod' in cmd else 'pnpm install/build dependencies' if 'pnpm install' in cmd else 'pnpm global install' if 'npm install -g pnpm' in cmd else 'copy' if 'COPY' in cmd else 'other')
                  rows.append({'index':i,'digest':layer['digest'],'diff_id':diff,'compressed_bytes':layer['size'],'kind':kind})
              largest=max(rows,key=lambda x:x['compressed_bytes'])
              _,blobheaders=request(base+'/blobs/'+largest['digest'],headers,'HEAD')
              output={'label':label,'elapsed_seconds':round(time.monotonic()-started,2),'total_compressed_bytes':sum(l['size'] for l in manifest['layers']),'largest_blob_head_ok':True,'layers':rows}
              print(json.dumps(output),flush=True)
              return rows
          
          base,headers=client('registry.cn-hangzhou.aliyuncs.com','mufengtongxue/stock-front',True)
          for label,digest in [('dockerhub_original','sha256:6b37362b3da78869050b894b799ad4df04f1f3b52774087db0d81151570244c8'),('aliyun_recompressed','sha256:f072f58012e569b0fc15edd040e893d5a99c5cd8050a0e93304598c2bf794a83')]:
              try:
                  request(base+'/blobs/'+digest,headers,'HEAD')
                  print(json.dumps({'probe':label,'status':200}),flush=True)
              except urllib.error.HTTPError as e:
                  print(json.dumps({'probe':label,'status':e.code}),flush=True)
          
          PY
