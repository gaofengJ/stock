name: Validate direct image push and cache reuse
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify_image:
    if: github.ref == 'refs/heads/codex/fix-registry-layer-reuse'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |-
            apps/back
            apps/front
            .github
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Verify production image and native Argon2 runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/back/dockerfile
          platforms: linux/amd64
          load: true
          tags: stock-back-verify
          cache-from: type=gha,version=2,scope=stock-back-verify
          cache-to: type=gha,version=2,scope=stock-back-verify,mode=max
          provenance: false
      - name: Check native Argon2 in the exported image
        run: docker run --rm stock-back-verify node scripts/check-argon2.cjs
  round_1:
    needs: verify_image
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        app:
          - back
          - front
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |-
            apps/back
            apps/front
            .github
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
        if: matrix.app == 'front'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        if: matrix.app == 'front'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        if: matrix.app == 'front'
      - name: Build Project
        run: pnpm run build:front
        if: matrix.app == 'front'
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Login to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push back round 1
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: apps/back/dockerfile
          platforms: linux/amd64
          push: true
          tags: registry.cn-hangzhou.aliyuncs.com/mufengtongxue/stock-back:cache-check-${{
            github.sha }}-1
          cache-from: type=gha,version=2,scope=stock-back-verify
          provenance: false
        if: matrix.app == 'back'
      - name: Build and push front round 1
        uses: docker/build-push-action@v7
        with:
          context: apps/front
          platforms: linux/amd64
          push: true
          tags: registry.cn-hangzhou.aliyuncs.com/mufengtongxue/stock-front:cache-check-${{
            github.sha }}-1
          cache-from: type=gha,version=2,scope=stock-front
          cache-to: type=gha,version=2,scope=stock-front,mode=max
          provenance: false
        if: matrix.app == 'front'
      - name: Record compressed layer digests
        env:
          IMAGE: registry.cn-hangzhou.aliyuncs.com/mufengtongxue/stock-${{ matrix.app
            }}:cache-check-${{ github.sha }}-1
        run: "docker buildx imagetools inspect --raw \"$IMAGE\" | jq '{config, layers:
          [.layers[] | {digest, size}]}'"
  round_2:
    needs: round_1
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        app:
          - back
          - front
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |-
            apps/back
            apps/front
            .github
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
        if: matrix.app == 'front'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        if: matrix.app == 'front'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        if: matrix.app == 'front'
      - name: Build Project
        run: pnpm run build:front
        if: matrix.app == 'front'
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Login to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push back round 2
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: apps/back/dockerfile
          platforms: linux/amd64
          push: true
          tags: registry.cn-hangzhou.aliyuncs.com/mufengtongxue/stock-back:cache-check-${{
            github.sha }}-2
          cache-from: type=gha,version=2,scope=stock-back-verify
          provenance: false
        if: matrix.app == 'back'
      - name: Build and push front round 2
        uses: docker/build-push-action@v7
        with:
          context: apps/front
          platforms: linux/amd64
          push: true
          tags: registry.cn-hangzhou.aliyuncs.com/mufengtongxue/stock-front:cache-check-${{
            github.sha }}-2
          cache-from: type=gha,version=2,scope=stock-front
          cache-to: type=gha,version=2,scope=stock-front,mode=max
          provenance: false
        if: matrix.app == 'front'
      - name: Record compressed layer digests
        env:
          IMAGE: registry.cn-hangzhou.aliyuncs.com/mufengtongxue/stock-${{ matrix.app
            }}:cache-check-${{ github.sha }}-2
        run: "docker buildx imagetools inspect --raw \"$IMAGE\" | jq '{config, layers:
          [.layers[] | {digest, size}]}'"
