name: Inspect article release
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read server release progress
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo 'Running Docker operations (arguments omitted):'
            ps -eo pid,etime,args | awk '$3 ~ /(^|\/)docker$/ {print $1,$2,$3,$4}'
            echo 'Article containers:'
            docker ps --filter name=stock-blog --format '{{.Names}} {{.Status}} {{.Image}}'
            echo 'Article images:'
            docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep 'stock-blog' || true
            echo 'Media-verified release build directories:'
            find /opt/stock-blog-style -maxdepth 2 -name Dockerfile -print
            echo 'Memory and disk:'
            free -m
            df -h / /opt
