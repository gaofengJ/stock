name: Inspect article release
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read server release progress
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 40m
          script: |
            set -eu
            if ! docker inspect stock-blog >/dev/null 2>&1; then
              docker run --restart unless-stopped -d -p 8082:80 --name stock-blog registry.cn-hangzhou.aliyuncs.com/mufengtongxue/stock-blog:178fd09a2f2e902e7fc74f66116887a05de3dc38
            fi
            echo 'Previous article service restored while the new image downloads.'
            echo 'Running Docker operations (arguments omitted):'
            ps -eo pid,etime,args | awk '$3 ~ /(^|\/)docker$/ {print $1,$2,$3,$4}'
            echo 'Article containers:'
            docker ps --filter name=stock-blog --format '{{.Names}} {{.Status}} {{.Image}}'
            docker ps -a --filter name=stock-blog --format '{{.Names}} {{.Status}} {{.Ports}}'
            echo 'Deployment order and runtime options:'
            grep -E 'docker (stop|rm|pull|run)|--name|--restart|--network|--publish| -p | -v ' /home/stock-blog-deploy.sh || true
            python3 - <<'PY'
            import json
            p='/opt/stock-blog-style/178fd09a2f2e902e7fc74f66116887a05de3dc38/previous-container.json'
            x=json.load(open(p))[0]
            print(json.dumps({k:x['HostConfig'].get(k) for k in ['NetworkMode','PortBindings','Binds','RestartPolicy']},ensure_ascii=False))
            PY
            echo 'Article images:'
            docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep 'stock-blog' || true
            echo 'Media-verified release build directories:'
            find /opt/stock-blog-style -maxdepth 2 -name Dockerfile -print
            echo 'Memory and disk:'
            free -m
            df -h / /opt
