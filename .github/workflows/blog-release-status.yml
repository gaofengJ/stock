name: Reuse an identical verified image for the current release
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  RELEASE_SHA: a7a3a25456e0265dcc9585915212bc6de866f05d
  REFERENCE_SHA: ac730979b89711dafa5c8192e84ee8fda4469817
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stock-back-image-a7a3a25456e0265dcc9585915212bc6de866f05d
          path: verified-image
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: gaofengJ/stock
          run-id: 37500142572
      - uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Compare the current tested image with the previously relayed image
        id: compare
        run: |
          gzip -dc verified-image/stock-back-image.tar.gz | docker load
          expected=$(docker image inspect stock-back-verify --format '{{.Id}}')
          timeout 60 docker buildx imagetools inspect "registry.cn-hangzhou.aliyuncs.com/mufengtongxue/stock-back:$REFERENCE_SHA" --raw > manifest.json
          actual=$(jq -er '.config.digest' manifest.json)
          [[ "$expected" == "$actual" ]] || { echo 'Images differ; reuse stopped without changing the service'; exit 1; }
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          echo 'Current verified artifact is identical to the relayed runtime image.'
      - name: Publish the identical image with the current immutable source tag
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPECTED_IMAGE_ID: ${{ steps.compare.outputs.expected }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: RELEASE_SHA,REFERENCE_SHA,EXPECTED_IMAGE_ID,DOCKER_USERNAME,DOCKER_PASSWORD
          command_timeout: 12m
          script: |
            set -Eeuo pipefail
            [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ && "$REFERENCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$EXPECTED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
            reference="registry.cn-hangzhou.aliyuncs.com/mufengtongxue/stock-back:$REFERENCE_SHA"
            image="registry.cn-hangzhou.aliyuncs.com/mufengtongxue/stock-back:$RELEASE_SHA"
            [[ "$(docker image inspect "$reference" --format '{{.Id}}')" == "$EXPECTED_IMAGE_ID" ]] || { echo 'Server image differs from the verified artifact'; exit 1; }
            docker tag "$reference" "$image"
            printf '%s' "$DOCKER_PASSWORD" | timeout 60 docker login --username "$DOCKER_USERNAME" --password-stdin registry.cn-hangzhou.aliyuncs.com
            timeout 600 docker push "$image"
            echo 'Identical tested image published; application and database were not changed.'
