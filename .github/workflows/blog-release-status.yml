name: Inspect article release
on:
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Validate and install safe article deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 10m
          script: |
            set -eu
            release_dir=$(mktemp -d /tmp/stock-blog-deploy.XXXXXX)
            printf '%s' '' | base64 -d > "$release_dir/deploy.sh"
            printf '%s' '' | base64 -d > "$release_dir/test_deploy.py"
            sh -n "$release_dir/deploy.sh"
            python3 "$release_dir/test_deploy.py"
            cp -p /home/stock-blog-deploy.sh "/home/stock-blog-deploy.sh.backup-$(date +%Y%m%d%H%M%S)"
            install -m 755 "$release_dir/deploy.sh" /home/stock-blog-deploy.sh
            sh /home/stock-blog-deploy.sh
            docker ps --filter name=stock-blog --format '{{.Names}} {{.Status}}'
