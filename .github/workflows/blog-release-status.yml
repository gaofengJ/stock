name: Inspect article release
on:
  workflow_dispatch:
jobs:
  credential-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Compare current deployment credential without revealing it
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUDIT_HISTORICAL_DB_HASH: ${{ secrets.AUDIT_HISTORICAL_DB_HASH }}
        run: |
          node -e "const c=require('node:crypto'); const value=process.env.DB_PASSWORD, expected=process.env.AUDIT_HISTORICAL_DB_HASH; if(!expected){console.log('One-time credential comparison already completed; skipped.');process.exit(0)} if(!value || !/^[a-f0-9]{64}$/.test(expected))throw new Error('Audit input unavailable'); console.log('Current deployment credential reuses historical literal:',c.createHash('sha256').update(value).digest('hex')===expected);"
      - name: Check whether the backend port is externally reachable
        env:
          AUDIT_HOST: ${{ secrets.SSH_HOST }}
        run: |
          node -e "(async()=>{try{const r=await fetch('http://'+process.env.AUDIT_HOST+':3000/api/auth/me',{signal:AbortSignal.timeout(10000)});console.log('Public runner reached backend port 3000: true; anonymous account HTTP:',r.status)}catch(e){console.log('Public runner reached backend port 3000: false (one bounded connection probe)')}})();"
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read server release progress
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo 'Backend runtime:'
            docker exec stock-back node --version
            echo 'Proxy connection classification:'
            python3 - <<'PY'
            import glob, re, ipaddress
            found = 0
            for root in ['/etc/nginx', '/usr/local/nginx/conf', '/www/server/nginx/conf']:
                for name in glob.glob(root+'/**/*.conf', recursive=True):
                    try:
                        text = open(name).read()
                    except (IOError, UnicodeError):
                        continue
                    hosts = re.findall(r'(?:proxy_pass\s+https?://|server\s+)([^\s/:;]+):3000', text)
                    for host in hosts:
                        found += 1
                        try:
                            address = ipaddress.ip_address(host)
                            kind = 'loopback' if address.is_loopback else 'docker-gateway' if host == '172.17.0.1' else 'other-private-ip' if address.is_private else 'public-ip'
                        except ValueError:
                            kind = 'localhost' if host == 'localhost' else 'hostname'
                        print('Backend proxy destination classification:',kind)
            print('Backend proxy references inspected:',found)
            PY
            echo 'Docker bridge gateway check:'
            docker network inspect bridge --format '{{json .IPAM.Config}}' | python3 -c 'import json,sys; print("Expected Docker gateway exists:",any(x.get("Gateway")=="172.17.0.1" for x in json.load(sys.stdin)))'
            echo 'Backend port exposure classification:'
            docker inspect stock-back --format '{{json .HostConfig.PortBindings}}' | python3 -c 'import json,sys; p=json.load(sys.stdin).get("3000/tcp") or []; print("Bound to all host interfaces:",any(x.get("HostIp") in ("", "0.0.0.0", "::") for x in p))'
            echo 'Frontend configuration mount classification:'
            docker inspect stock-front --format '{{json .Mounts}}' | python3 -c 'import json,sys; print("Mounted Nginx configuration:",any(x["Destination"].startswith("/etc/nginx") for x in json.load(sys.stdin)))'
            echo 'Running Docker operations (arguments omitted):'
            ps -eo pid,etime,args | awk '$3 ~ /(^|\/)docker$/ {print $1,$2,$3,$4}'
            echo 'Article containers:'
            docker ps --filter name=stock-blog --format '{{.Names}} {{.Status}} {{.Image}}'
            echo 'Article images:'
            docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep 'stock-blog' || true
            echo 'Media-verified release build directories:'
            find /opt/stock-blog-style -maxdepth 2 -name Dockerfile -print
            echo 'Memory and disk:'
            free -m
            df -h / /opt
